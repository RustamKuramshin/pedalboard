name: PluginScope wheels

# Wheels of the PluginScope fork (branch `pluginscope`) for the platforms
# PluginScope ships on: CPython 3.13 on macOS arm64, macOS x86_64 and
# Windows x64. A separate workflow rather than a change to all.yml keeps the
# fork additive, so rebasing on upstream stays cheap. arm64 is built on a
# native arm64 runner (macos-15), so the import test runs on the wheel's
# own architecture; upstream cross-compiles it on macos-15-intel.
#
# A tag `v<version>` (for example `v0.9.26+pluginscope.1`) builds the wheels
# and attaches them to a GitHub Release of that tag; workflow_dispatch only
# builds them (artifact `wheels`).

on:
  push:
    tags:
      - "v*+pluginscope.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, build: cp313-macosx_arm64 }
          - { os: macos-15-intel, build: cp313-macosx_x86_64 }
          - { os: windows-latest, build: cp313-win_amd64 }
    name: Build wheel for ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        run: python -m pip install 'cibuildwheel>=4.2,<5'
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS: ${{ contains(matrix.build, 'arm64') && 'arm64' || 'auto64' }}
          CIBW_TEST_COMMAND: "python -c \"import pedalboard; print(pedalboard.__version__)\""
          CIBW_TEST_REQUIRES: ""
          CIBW_ENVIRONMENT: NPY_BLAS_ORDER="" NPY_LAPACK_ORDER="" USE_MARCH_NATIVE=0
          # Same minimum macOS deployment target as upstream (pybind11's minimum).
          MACOSX_DEPLOYMENT_TARGET: "10.14"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.build }}
          path: ./wheelhouse/*.whl

  merge:
    runs-on: ubuntu-latest
    needs: build-wheels
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: wheels
          pattern: wheel-*

  release:
    runs-on: ubuntu-latest
    needs: merge
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels
      - name: Create the release with the wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l wheels
          (cd wheels && sha256sum *.whl > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" wheels/*.whl wheels/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Wheels of the PluginScope fork (branch pluginscope), CPython 3.13: macOS arm64, macOS x86_64, Windows x64."
